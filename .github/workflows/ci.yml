name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"

jobs:
  quality:
    name: lint and type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          # No uv.lock in this project; key the cache on the manifest instead.
          cache-dependency-glob: pyproject.toml
      - name: Install
        run: uv pip install --system -e ".[dev]"
      - name: Ruff
        run: |
          ruff check .
          ruff format --check .
      - name: Mypy
        run: mypy

  test:
    name: test (python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          # No uv.lock in this project; key the cache on the manifest instead.
          cache-dependency-glob: pyproject.toml
      - name: Install
        run: uv pip install --system -e ".[dev]"
      - name: Pytest
        run: pytest --cov=projectmind --cov-report=term-missing

  postgres:
    name: storage parity on postgres
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: projectmind
          POSTGRES_PASSWORD: projectmind
          POSTGRES_DB: projectmind
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U projectmind -d projectmind"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      PROJECTMIND_TEST_DB_URL: postgresql://projectmind:projectmind@localhost:5432/projectmind
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          # No uv.lock in this project; key the cache on the manifest instead.
          cache-dependency-glob: pyproject.toml
      - name: Install
        run: uv pip install --system -e ".[dev]"
      - name: Parity suite
        run: pytest -m postgres -q
