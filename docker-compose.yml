# Optional. ProjectMind defaults to SQLite and needs nothing running.
#
# Bring this up only if you want the Postgres + pgvector backend:
#
#   docker compose up -d
#   export PROJECTMIND_DB_URL=postgresql://projectmind:projectmind@localhost:5433/projectmind
#   projectmind init
#
# Port 5433 is deliberate, so this never collides with a Postgres you already
# run on 5432.

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: projectmind-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: projectmind
      POSTGRES_PASSWORD: projectmind
      POSTGRES_DB: projectmind
    ports:
      - "5433:5432"
    volumes:
      - projectmind-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U projectmind -d projectmind"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  projectmind-pgdata:
