[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "projectmind"
version = "0.0.1"
description = "A cross-project engineering memory layer for coding agents."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "Parth Biyani", email = "parthbiyani9@gmail.com" }]
keywords = ["memory", "mcp", "rag", "coding-agents", "retrieval"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries",
]
dependencies = [
  "pydantic>=2.7",
  "pydantic-settings>=2.2",
  "pyyaml>=6.0",
  "rich>=13.7",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.10",
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "types-pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/ParthBiyani/ProjectMind"
Issues = "https://github.com/ParthBiyani/ProjectMind/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/projectmind"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["projectmind"]

[tool.mypy]
python_version = "3.11"
packages = ["projectmind"]
mypy_path = "src"
strict = true
warn_unreachable = true
disallow_untyped_decorators = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = ["postgres: requires a live postgres instance"]
