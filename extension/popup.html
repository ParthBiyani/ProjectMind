<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ProjectMind</title>
<style>
  :root { color-scheme: light dark; --fg: #1f2328; --bg: #ffffff; --muted: #656d76; --line: #d0d7de; --ok: #1a7f37; --bad: #cf222e; }
  @media (prefers-color-scheme: dark) { :root { --fg: #e6edf3; --bg: #0d1117; --muted: #8b949e; --line: #30363d; --ok: #3fb950; --bad: #f85149; } }
  body { margin: 0; padding: 14px; width: 280px; font: 13px/1.45 system-ui, sans-serif; color: var(--fg); background: var(--bg); }
  h1 { font-size: 14px; margin: 0 0 8px; }
  #status { padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; color: var(--muted); margin-bottom: 10px; }
  #status.ok { color: var(--ok); } #status.bad { color: var(--bad); }
  button { width: 100%; padding: 7px 10px; margin-bottom: 6px; font: inherit; color: inherit; background: transparent; border: 1px solid var(--line); border-radius: 6px; cursor: pointer; }
  button:hover { border-color: var(--muted); }
  a { color: inherit; font-size: 12px; }
  #message { min-height: 1.4em; color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
  <h1>ProjectMind</h1>
  <div id="status">Checking…</div>
  <button id="remember">Remember this page</button>
  <button id="pause">Pause capture</button>
  <button id="never">Never capture this site</button>
  <div id="message"></div>
  <a href="#" id="options">Options</a>
  <script src="lib.js"></script>
  <script src="popup.js"></script>
</body>
</html>
