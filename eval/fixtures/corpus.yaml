# Evaluation fixture corpus.
#
# These records are HAND-AUTHORED FIXTURES, not ingested data. They are modelled
# on the shape and stack of a real local repository set so that retrieval is
# scored against something with realistic overlap and realistic near-misses,
# and so that scoring is deterministic in CI. Real ingested memory lives in the
# runtime database and never in this file.
#
# source_url uses a `fixture://` scheme precisely so a fixture can never be
# mistaken for a real commit or pull request.

name: local-portfolio-fixture
version: "1.0"
description: >-
  Fourteen projects and fifty-two episodic records spanning mobile, ML and
  backend work, with deliberate cross-project overlap in backend choice, state
  management, model serving and data-loading patterns.

